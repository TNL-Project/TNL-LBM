# common setup for jobs that configure or build the project
# (the block is a single string so it can be reused via the *project-setup anchor)
.project-setup: &project-setup
  # make sure that $PATH and other essential variables are set correctly
  - source /etc/profile
  # extra dependencies for python bindings
  - pacman -Suy --needed --noconfirm python-mpi4py

default:
  interruptible: true
  image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-cuda:latest"
  before_script:
    - *project-setup

variables:
  # TNL-LBM has high memory-per-core requirements, so use max 8 parallel build jobs
  # to avoid OOM errors
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
  # Open MPI refuses to launch as root (jobs run as root in the container)
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  # avoid Open MPI abort on dual-accelerator hosts (both CUDA and ROCm detected)
  OMPI_MCA_accelerator: "null"

stages:
  - lint
  - build

typos:
  stage: lint
  image: "quay.io/archlinux/archlinux:base"
  before_script:
    - pacman -Syu --needed --noconfirm typos
  script:
    - typos --color always --sort

check format:
  stage: lint
  image: "quay.io/archlinux/archlinux:base"
  before_script:
    - pacman -Syu --needed --noconfirm just ruff clang python-gersemi tombi
  script:
    - just check-format
  variables:
    FORCE_COLOR: 1

ruff check:
  stage: lint
  image: "quay.io/archlinux/archlinux:base"
  before_script:
    - pacman -Syu --needed --noconfirm ruff
  script:
    - ruff check --exit-zero
    - ruff check --output-format=gitlab > code-quality-report.json
  variables:
    FORCE_COLOR: 1
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

pyright check:
  stage: lint
  before_script:
    - *project-setup
    # runtime dependencies of scripts and tests that pyright must resolve
    - pacman -Suy --needed --noconfirm just pyright
      python-cuda-bindings
      python-httpx python-plotly python-streamlit python-tabulate
    # see comment about --overwrite for paraview in build_CUDA
    - pacman -Suy --needed --noconfirm --overwrite 'usr/lib/libGLX_indirect.so*' paraview
  script:
    # the pytnl_lbm stubs in build/pytnl_lbm and the pytnl package built by
    # FetchContent in build/_deps/pytnl-build/src are needed for pyright to
    # resolve the bindings
    - just configure
    - just build pytnl_lbm
    - just check-typing

clangd-tidy:
  stage: lint
  before_script:
    - *project-setup
    - pacman -Suy --needed --noconfirm just clang clangd-tidy
  script:
    - just check-clangd-tidy

build_CUDA:
  stage: build
  tags:
    - docker
    - nvidia
  parallel:
    matrix:
      - CMAKE_BUILD_TYPE: ["Release", "Debug"]
        TNL_LBM_STREAMING_PATTERN: ["AB_PULL", "AB_PUSH", "AA", "ESO_PULL", "ESO_PUSH", "ESO_TWIST"]
  script:
    # extra dependencies for the test suite
    # ParaView provides the libcatalyst-paraview.so implementation required by the inline Catalyst plugin test.
    # --overwrite is needed because the NVIDIA CDI runtime creates a symlink for libGLX_indirect.so.0 to libGLX_nvidia.so,
    # which otherwise conflicts with the mesa dependency of paraview.
    - pacman -Suy --needed --noconfirm --overwrite 'usr/lib/libGLX_indirect.so*' paraview python-pytest python-cuda-bindings
    - cmake -B build -S . -G Ninja
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}
            -DTNL_LBM_STREAMING_PATTERN=${TNL_LBM_STREAMING_PATTERN}
    - cmake --build build
    # pytest test suite
    - pytest
  variables:
    # CUDA builds run on runners with GPU passthrough
    OMPI_MCA_accelerator: "cuda"

build_HIP:
  stage: build
  image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-rocm:latest"
  tags:
    - docker
    - hip-rocm
  parallel:
    matrix:
      - CMAKE_BUILD_TYPE: ["Release", "Debug"]
  script:
    - cmake -B build -S . -G Ninja
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}
    - cmake --build build
  variables:
    # ROCm builds run on runners with AMD GPU passthrough
    OMPI_MCA_accelerator: "rocm"

build_without_MPI:
  stage: build
  script:
    - cmake -B build -S . -G Ninja
            -DCMAKE_BUILD_TYPE=Debug
            -DTNL_LBM_USE_MPI=OFF
    - cmake --build build

build_subproject:
  stage: build
  image: "registry.gitlab.com/tnl-project/container-images/archlinux-cuda:latest"
  script:
    - pacman -Syu --needed --noconfirm cmake ninja git libpng fmt spdlog adios2
    - cd tests/subproject
    - cmake -B build -S . -G Ninja
            -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build
